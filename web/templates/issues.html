<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全量问题 · 鸿蒙开发者文档</title>
<style>
  :root{--accent:#2f6fed;--accent-weak:#eaf1ff;--border:#e6e8eb;--muted:#6b7280;--danger:#d94a4a;--warn:#b3761f;--info:#57606a}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;color:#1f2430;background:#f7f8fa}
  header{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
  header h1{font-size:17px;margin:0}
  header a{color:var(--muted);text-decoration:none;font-size:13px}
  header a:hover{color:var(--accent)}
  .wrap{max-width:1180px;margin:18px auto;padding:0 20px 60px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .card.offcard{opacity:.5}
  .card .n{font-size:22px;font-weight:700}
  .card .tagoff{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--muted);vertical-align:2px}
  .card .l{color:var(--muted);font-size:12px;margin-top:2px}
  .filters{background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px 14px 10px;margin-bottom:14px}
  .frow{position:relative;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:7px 0 7px 76px;border-bottom:1px solid #f4f5f7;min-height:34px}
  .frow:last-child{border-bottom:0}
  .flabel{position:absolute;left:0;top:50%;transform:translateY(-50%);width:68px;color:#6b7280;font-size:12.5px;font-weight:600;letter-spacing:.5px}
  .range{display:none;align-items:center;gap:6px}
  input[type=date]{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12.5px;color:#1f2430;background:#fff}
  input[type=date]:disabled{background:#f7f8fa;color:#9aa3b2}
  select,input[type=text]{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff;color:#1f2430}
  input[type=text]{min-width:240px}
  button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  #f-export{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  #f-export:hover{filter:brightness(1.06);color:#fff}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px}
  th,td{padding:9px 12px;border-bottom:1px solid #f0f1f3;text-align:left;vertical-align:top}
  th{background:#fafbfc;color:#4b5563;font-weight:600;font-size:12px;white-space:nowrap}
  tr:hover td{background:#fcfdff}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:#f1f3f6;color:#4b5563;
       white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top;box-sizing:border-box}
  .sev-error{background:#fdeaea;color:var(--danger)}
  .sev-warn{background:#fdf3e3;color:var(--warn)}
  .sev-info{background:#eef1f6;color:var(--info)}
  .doc a{color:var(--accent);text-decoration:none;font-weight:600}
  .doc a:hover{text-decoration:underline}
  #list{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #list table{table-layout:fixed;width:100%;min-width:820px}
  #list td.type{padding-top:9px}
  #list th.c-type{width:126px} #list th.c-doc{width:94px}
  #list th.c-off{width:94px} #list th.c-date{width:105px}
  #list td.msg{overflow-wrap:anywhere}
  .msg-extra{margin-top:6px}
  .msg-extra .issue-link{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
  .msg-extra .issue-link:hover{text-decoration:underline}
  #f-kit{min-width:180px;max-width:220px}
  #f-kit:disabled{background:#f7f8fa;color:#9aa3b2}
  #f-sub option.zero, #f-kit option.zero{color:#9aa3b2}
  #f-sub:disabled{color:#9aa3b2}
  .thumb{max-height:72px;max-width:170px;border:1px solid var(--border);border-radius:4px;vertical-align:middle;background:#fff}
  .off{min-width:80px;max-width:80px}
  .off a{color:var(--accent);text-decoration:none}
  .off a:hover{text-decoration:underline}
  .msg{color:#39414d;line-height:1.6;word-break:break-word}
  .meta{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:13px}
  .pager button[disabled]{opacity:.45;cursor:not-allowed}
  @media (max-width:720px){
    .wrap{padding:0 12px 40px}
    .frow{gap:8px;padding:8px 0}
    .flabel{position:static;transform:none;width:100%;margin-bottom:2px}
    input[type=text],select{max-width:100%}
    input[type=text]{min-width:0}
    #list table{min-width:0;font-size:12.5px}
    th,td{padding:8px 8px}
    #list th.c-type{width:96px}
    #list th.c-doc{width:60px} #list th.c-off{width:64px}
    #list th.c-date,#list td.c-date{display:none}
    .tag{white-space:normal;line-height:1.35}
  }
  .c-op{width:64px;text-align:center}
  .mini2{border:1px solid var(--border);background:#fff;border-radius:6px;padding:2px 8px;
         font-size:12px;color:#5a6472;cursor:pointer;white-space:nowrap}
  .mini2:hover{border-color:var(--accent);color:var(--accent)}
  .login-hint{color:var(--accent);font-size:12px;text-decoration:none;white-space:nowrap}
  .login-hint:hover{text-decoration:underline}
  #userbox{display:flex;align-items:center;gap:8px;font-size:13px}
  #userbox a{color:var(--accent);text-decoration:none}
  #userbox .who{color:#39414d;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{text-align:center;color:var(--muted);padding:40px 0;background:#fff;border:1px solid var(--border);border-radius:10px}
</style>
</head>
<body>
<header>
  <h1>全量问题</h1>
  <a href="/">← 返回文档站</a>
  <a href="/sync">📚 每日文档增量记录</a>
  <span style="flex:1"></span>
  <span id="userbox"></span>
</header>

<div class="wrap">
  <div class="cards" id="cards"></div>

  <div class="filters">
    <div class="frow">
      <span class="flabel">问题类型</span>
      <select id="f-rule"><option value="">全部类型</option></select>
      <span style="flex:1"></span>
      <span class="meta" id="count"></span>
      <span class="meta" id="last-sync" style="font-size:12px"></span>
      <button id="f-subscribe" title="按这套筛选去「个人中心 → 我关注的问题」新建一个关注范围">关注这组筛选</button>
      <button id="f-export" title="按当前筛选导出全部问题（不分页）">导出 Excel</button>
    </div>
    <div class="frow">
      <span class="flabel">问题归属</span>
      <select id="f-lang">
        <option value="">全部语言</option>
        <option value="cn">中文</option>
        <option value="en">英文</option>
      </select>
      <select id="f-section"><option value="">全部板块</option></select>
      <select id="f-kind" disabled title="仅「指南与API参考」可用" style="display:none">
        <option value="">指南+API参考</option>
        <option value="guide">仅指南</option>
        <option value="api">仅 API 参考</option>
      </select>
      <select id="f-sub" disabled title="先选板块"><option value="">全部细分</option></select>
      <select id="f-kit" disabled title="先选领域"><option value="">全部 Kit</option></select>
    </div>
    <div class="frow">
      <span class="flabel">问题状态</span>
      <select id="f-status">
        <option value="open" selected>未解决</option>
        <option value="all">全部状态</option>
        <option value="resolved">已解决</option>
        <option value="ignored">已忽略</option>
      </select>
    </div>
    <div class="frow">
      <span class="flabel">识别时间</span>
      <select id="f-when">
        <option value="">全部时间</option>
        <option value="today">今天</option>
        <option value="7d">近 7 天</option>
        <option value="30d">近 30 天</option>
        <option value="custom">自定义</option>
      </select>
      <span class="range" id="f-range">
        <input type="date" id="f-d1" title="起始日（只填左边＝该日及以后）">
        <span class="meta">至</span>
        <input type="date" id="f-d2" title="结束日（只填右边＝该日及以前；两边相同＝单日）">
      </span>
    </div>
  </div>

  <div id="list"></div>
  <div class="pager" id="pager"></div>
</div>

<script>
const RULE_LABELS = {{ rule_labels|tojson }};
const state = { page: 1, size: 50, total: 0, pages: 0 };

// 链接类问题：描述后面接「原文链接文字 + 原文地址」的超链接；图片类问题：直接显示图片
function shortMsg(s){ s = String(s||''); return s.length>110 ? s.slice(0,110)+'…' : s; }
function locOf(it){ try { return JSON.parse(it.locator||'{}'); } catch(e){ return {}; } }
// 链接类：把 message 里的目标路径换成原文链接（文字取文档里的锚文本，地址取官网原文地址）
function msgOf(it){
  const L = locOf(it), rule = it.rule||'';
  const msg = String(it.message||'');
  if (rule.indexOf('link.') !== 0) return esc(msg);
  const t = L.target || L.url || '';
  const href = it.href || (/^https?:/i.test(t) ? t : '');
  if (!href) return esc(msg);
  const text = it.link_text || t;
  const i = msg.lastIndexOf('：');
  const prefix = i > 0 ? msg.slice(0, i + 1) : msg;
  return esc(prefix) + `<a class="issue-link" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(href)}">${esc(text)}</a>`;
}
function extraOf(it, lang, section){
  const L = locOf(it), rule = it.rule||'';
  if (rule.indexOf('link.') === 0) return '';
  if (rule.indexOf('image.') === 0 && L.image){
    const src = '/docs/' + lang + '/' + section + '/' + String(L.image).replace(/^\/+/, '');
    return `<div class="msg-extra"><a href="${esc(src)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(src)}" alt="问题图片" loading="lazy"></a></div>`;
  }
  return '';
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ── GitCode 登录（仅用于「忽略」的身份识别）────────────────────────────
let ME = {user: null, enabled: false};
async function loadMe(){
  try { ME = await (await fetch('/api/me')).json(); } catch(e){ ME = {user: null, enabled: false}; }
  const box = document.getElementById('userbox');
  if (!ME.enabled){ box.innerHTML = ''; return; }
  box.innerHTML = (ME.user && ME.user.login)
    ? `<span class="who" title="${esc(ME.user.login)}">👤 ${esc(ME.user.name || ME.user.login)}</span><a href="/auth/logout">退出</a>`
    : `<a href="/auth/login">GitCode 登录</a>`;
}

function opCell(it){
  if (!ME.user) return ME.enabled
    ? '<a class="login-hint" href="/auth/login" title="用 GitCode 登录后可以忽略问题">请先登录</a>'
    : '<span class="meta">—</span>';
  if (it.status === 'ignored') return `<button class="mini2" data-act="unignore" data-id="${it.id}">恢复</button>`;
  if (it.status === 'resolved') return '<span class="meta">—</span>';
  return `<button class="mini2" data-act="ignore" data-id="${it.id}">忽略</button>`;
}

async function issueAct(kind, id){
  const r = await fetch(`/api/issues/${id}/${kind}`, {method: 'POST'});
  let d = {};
  try { d = await r.json(); } catch(e){}
  if (!r.ok){
    if (d.need_login){ alert('请先用 GitCode 登录'); location.href = '/auth/login'; return; }
    alert(d.error || '操作失败'); return;
  }
  await loadFacets(); loadList();
}

document.getElementById('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (b) issueAct(b.dataset.act, b.dataset.id);
});

async function loadFacets(){
  const d = await (await fetch('/api/facets')).json();
  // 重建下拉会把已选值冲掉（忽略/恢复后要留在当前视图，不能跳回全量列表）
  const keep = {
    rule: document.getElementById('f-rule').value,
    section: document.getElementById('f-section').value,
    sub: document.getElementById('f-sub').value,
    kit: document.getElementById('f-kit').value,
  };
  const total = d.langs.reduce((a,b)=>a+b.n,0);
  document.getElementById('cards').innerHTML =
    `<div class="card" id="card-total" style="cursor:pointer" title="查看全部未解决问题（清空其余筛选）"><div class="n">${total}</div><div class="l">未解决问题总数</div></div>` +
    d.rules.map(r=>`<div class="card${r.enabled === false ? ' offcard' : ''}" data-rule="${r.rule}" style="cursor:pointer"><div class="n">${r.n}${r.enabled === false ? '<span class="tagoff">已关闭</span>' : ''}</div><div class="l">${esc(r.label)}</div></div>`).join('');
  document.querySelectorAll('#cards .card[data-rule]').forEach(c=>c.onclick=()=>{
    document.getElementById('f-rule').value=c.dataset.rule;
      document.getElementById('f-status').value='open';   // 卡片上的数是未解决数，点开就按未解决看
      state.page=1; loadList();
  });
  // 总数卡片：点击 = 清空筛选，看全部未解决问题
  document.getElementById('card-total').onclick = () => {
    ['f-rule','f-section','f-sub','f-kit','f-kind'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = '';
    });
    document.getElementById('f-d1').value = '';
    document.getElementById('f-d2').value = '';
    document.getElementById('f-when').value = '';
    document.getElementById('f-range').style.display = 'none';
    document.getElementById('f-status').value = 'open';
    state.page = 1; loadList();
  };
  const rs = document.getElementById('f-rule');
  rs.innerHTML = '<option value="">全部类型</option>' + d.rules.map(r=>`<option value="${r.rule}">${esc(r.label)} (${r.n})${r.enabled === false ? ' · 已关闭' : ''}</option>`).join('');
  const ss = document.getElementById('f-section');
  ss.innerHTML = '<option value="">全部板块</option>' + d.sections.map(s=>`<option value="${s.section}">${esc(s.name)}（${s.n.toLocaleString()}）</option>`).join('');
  // 回填先前选中的类型 / 板块 / 细分 / Kit
  const pick = (el, v) => { if (v && [...el.options].some(o => o.value === v)) el.value = v; };
  pick(rs, keep.rule); pick(ss, keep.section);
  state.facets = d;
  fillSubs();
  pick(document.getElementById('f-sub'), keep.sub);
  fillKits();                                   // 领域定了才有 Kit 候选
  pick(document.getElementById('f-kit'), keep.kit);
  }

  // 二级：其它板块 = 侧边栏一级目录；「指南与API参考」= 领域（应用框架/系统/媒体…）
  function fillSubs(){
    const sec = document.getElementById('f-section').value;
    const lang = document.getElementById('f-lang').value;
    const sel = document.getElementById('f-sub');
    const old = sel.value;
    const f = state.facets || {};
    const cap = sec === 'capabilities';
    const kindVal = document.getElementById('f-kind').value;
    let list = (cap ? (f.domains || []) : (f.subs || []))
      .filter(s => s.section === sec && (!lang || s.lang === lang));
    // 「仅指南 / 仅 API 参考」：领域跟着换口径——只留该口径下有文档的领域，括号里的数也换成该口径的
    if (cap && kindVal){
      list = list.filter(s => (kindVal === 'api' ? s.nd_api : s.nd_guide) > 0)
                 .map(s => Object.assign({}, s, { n: kindVal === 'api' ? s.n_api : s.n_guide }));
    }
    // 某语言该板块只有一类（等于整个板块）时，这一项没有筛选意义，不列出来
    const perLang = {};
    list.forEach(s => { perLang[s.lang] = (perLang[s.lang] || 0) + 1; });
    const shown = list.filter(s => perLang[s.lang] > 1);
    const dup = {};
    list.forEach(s => { dup[s.name] = (dup[s.name] || 0) + 1; });
    // 语言=全部 而中英文都有细分时，逐项标出站点，避免像「工具」那样中英文条目混在一起看不出区别
    const multiLang = new Set(list.map(s => s.lang)).size > 1;
    sel.innerHTML = `<option value="">${sec === 'capabilities' ? '全部领域' : '全部细分'}</option>` +
      shown.map(s => {
        const v = `${s.lang}|${s.section}|${s.name}`;
        const label = (dup[s.name] > 1 || multiLang)
          ? `${s.name}（${s.lang === 'en' ? '英文站' : '中文站'}）` : s.name;
        return `<option value="${esc(v)}"${s.n === 0 ? ' class="zero"' : ''}>${esc(label)}（${s.n.toLocaleString()}）</option>`;
      }).join('');
    // 该板块本来就不做细分（如「设计」）时直接收起这个下拉，别留个灰框让人以为坏了
    const noSub = !!sec && shown.length === 0;
    sel.disabled = !sec || !shown.length;
    sel.style.display = noSub ? 'none' : '';
    if (noSub) sel.value = '';
    sel.title = sel.disabled ? '先选板块（该板块无需细分）'
      : (sec === 'capabilities' ? '按侧边栏二级目录（领域）筛选' : '按侧边栏目录筛选');
    if (old && shown.some(s => `${s.lang}|${s.section}|${s.name}` === old)) sel.value = old;
    else if (sel.disabled) sel.value = '';
    fillKits();
  }

  // 三级：Kit（仅「指南与API参考」，选中领域后可用）
  // 用原生 select 而不是「输入框 + datalist」：datalist 会按输入框里已有的文字过滤候选，
  // 选了 A 之后候选只剩 A，看起来就是“换不到 B”；而且 value 与文字不一致时还会渲染成两行。
  function fillKits(){
    const sec = document.getElementById('f-section').value;
    const lang = document.getElementById('f-lang').value;
    const dom = document.getElementById('f-sub').value;
    const sel = document.getElementById('f-kit');
    const kind = document.getElementById('f-kind');
    const on = sec === 'capabilities';
    // 「指南+API参考」这档只在指南与API参考板块有意义，其它板块直接收起来
    kind.disabled = !on;
    kind.style.display = on ? '' : 'none';
    if (!on) kind.value = '';
    if (!on){
      sel.innerHTML = '<option value="">全部 Kit</option>';
      sel.value = ''; sel.disabled = true;
      return;
    }
    const domLang = dom ? dom.split('|')[0] : '';
    const domName = dom ? dom.split('|')[2] : '';
    const kindVal = kind.value;
    const old = sel.value;
    if (!domName){                       // 还没选领域：只留占位，别把整站 100 个 Kit 塞进来
      sel.innerHTML = '<option value="">全部 Kit</option>';
      sel.value = ''; sel.disabled = true;
      return;
    }
    // facets.kits 是「板块 + 归一名 + 语言 + 领域」粒度的一行一条：
    // 名字按归一名合并成一条（中英文同一个 Kit 只出现一次），但计数只汇总**选中领域那种语言**，
    // 否则会把英文站的问题算进中文领域的数里，跟列表筛出来的条数对不上。
    const rows = (state.facets && state.facets.kits || [])
      .filter(k => k.section === sec && k.domain === domName && k.lang === (domLang || lang || 'cn')
                && (!kindVal || (kindVal === 'api' ? k.nd_api : k.nd_guide) > 0));
    const byKey = new Map();
    rows.forEach(k => {
      let e = byKey.get(k.key);
      if (!e) { e = {key: k.key, name: k.name, n: 0, n_api: 0, n_guide: 0}; byKey.set(k.key, e); }
      if (k.lang === 'cn') e.name = k.name;         // 中文名优先
      e.n += k.n; e.n_api += k.n_api; e.n_guide += k.n_guide;
    });
    const kits = [...byKey.values()]
      .map(k => Object.assign(k, {
        n: kindVal === 'api' ? k.n_api : (kindVal === 'guide' ? k.n_guide : k.n) }))
      .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
    sel.innerHTML = '<option value="">全部 Kit</option>' + kits.map(k => {
      const v = `${sec}|${k.key}`;
      return `<option value="${esc(v)}"${(k.n || 0) === 0 ? ' class="zero"' : ''}>${esc(k.name)}（${(k.n || 0).toLocaleString()}）</option>`;
    }).join('');
    sel.disabled = !domName || !kits.length;
    // 同一个领域内切换时保留之前选的 Kit；领域/口径变了就回到「全部 Kit」
    const still = [...sel.options].some(o => o.value === old);
    sel.value = (old && still) ? old : '';
  }

// 当前筛选写回地址栏：链接可直接分享，刷新/回退都停在同一视图
// 把这套筛选条件带到个人中心，作为一条订阅
function subThisFilter(){
  const p = new URLSearchParams(query());
  p.delete('page'); p.delete('size');
  location.href = '/me/subscribe?' + p.toString();
}
document.getElementById('f-subscribe').addEventListener('click', subThisFilter);

function syncUrl(){
  const p = new URLSearchParams(query());
  if (p.get('page') === '1') p.delete('page');
  if (p.get('size') === String(state.size)) p.delete('size');
  if (p.get('status') === 'open') p.delete('status');   // 未解决是默认值，省掉更短
  const qs = p.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

function query(){
  const p = new URLSearchParams({page: state.page, size: state.size, status: document.getElementById('f-status').value});
  const lang = document.getElementById('f-lang').value;
  const sec = document.getElementById('f-section').value;
  const rule = document.getElementById('f-rule').value;
  const sub = document.getElementById('f-sub').value;
  const kitVal = document.getElementById('f-kit').value;
  const kind = document.getElementById('f-kind').value;
  if (lang) p.set('lang', lang);
  if (sec) p.set('section', sec);
  if (rule) p.set('rule', rule);
  if (sub) p.set(sec === 'capabilities' ? 'domain' : 'sub', sub);
  if (kitVal) p.set('kit', kitVal);
  if (kind) p.set('kind', kind);
  const d1 = document.getElementById('f-d1').value;
  const d2 = document.getElementById('f-d2').value;
  if (d1) p.set('dfrom', d1);
  if (d2) p.set('dto', d2);
  return p.toString();
}

async function loadList(){
  const d = await (await fetch('/api/issues?' + query())).json();
  state.total = d.total; state.pages = d.pages;
  document.getElementById('count').textContent = `共 ${d.total.toLocaleString()} 条`;
  // 忽略掉本页最后一条后别停在空页上：退回上一页（URL 也跟着退回）
  if (!d.items.length && state.page > 1 && d.total > 0){ state.page -= 1; return loadList(); }
  if (!d.items.length){ document.getElementById('list').innerHTML = '<div class="empty">没有匹配的问题</div>'; }
  else {
    document.getElementById('list').innerHTML = `<table><thead><tr>
      <th class="c-type">类型</th><th>问题</th>
      <th class="c-doc">镜像文档</th><th class="c-off">官网文档</th><th class="c-date">识别日期</th>
      <th class="c-op">操作</th></tr></thead><tbody>` +
      d.items.map(it=>{
        const [lang,section,slug] = it.doc_key.split('/');
        const frag = it.anchorId ? '#' + encodeURIComponent(it.anchorId) : '';
        return `<tr>
          <td class="type"><span class="tag" title="${esc(it.rule_label)}">${esc(it.rule_label)}</span></td>
          <td class="msg">${msgOf(it)}${extraOf(it, lang, section)}${it.status === 'ignored'
              ? `<div class="meta">已忽略：${esc(it.ignored_by || '—')} · ${esc((it.ignored_at || '').slice(0, 16))}</div>` : ''}</td>
          <td class="doc"><a href="/#/${lang}/${section}/${slug}${frag}" target="_blank" rel="noopener"
                 title="${esc(lang + '/' + section + '/' + slug)}">链接</a></td>
          <td class="off">${it.official_url
              ? `<a href="${esc(it.official_url)}" target="_blank" rel="noopener noreferrer" title="${esc(it.official_url)}">链接</a>`
              : (it.official_gone ? '<span class="meta" title="官网已查不到这篇">已下架</span>'
                                  : '<span class="meta">—</span>')}</td>
          <td class="meta c-date">${esc((it.first_seen||'').slice(0,10))}</td>
          <td class="c-op">${opCell(it)}</td>
        </tr>`;
      }).join('') + '</tbody></table>';
  }
  renderPager();
  syncUrl();
}

function renderPager(){
  const p = state.page, t = state.pages;
  if (t <= 1){ document.getElementById('pager').innerHTML=''; return; }
  const btn=(label,page,dis)=>`<button ${dis?'disabled':''} data-p="${page}">${label}</button>`;
  const nums=[];
  const from=Math.max(1,p-3), to=Math.min(t,p+3);
  for(let i=from;i<=to;i++) nums.push(i===p?`<b>${i}</b>`:`<button data-p="${i}">${i}</button>`);
  document.getElementById('pager').innerHTML =
    `${btn('首页',1,p===1)}${btn('上一页',p-1,p===1)}${nums.join('')}${btn('下一页',p+1,p===t)}${btn('末页',t,p===t)}
     <span>第 ${p}/${t} 页 · 每页 ${state.size} 条</span>`;
  document.querySelectorAll('#pager button').forEach(b=>b.onclick=()=>{state.page=+b.dataset.p;loadList();window.scrollTo({top:0,behavior:'smooth'});});
}

function reload(){ state.page = 1; loadList(); }

['f-section','f-lang'].forEach(id => document.getElementById(id)
  .addEventListener('change', () => {
    // 换板块/语言后，「指南+API参考」这档可能不再适用，领域与 Kit 也要重算
    if (document.getElementById('f-section').value !== 'capabilities')
      document.getElementById('f-kind').value = '';
    document.getElementById('f-sub').value = '';
    document.getElementById('f-kit').value = '';
    fillSubs(); reload();
  }));
// 切「仅指南 / 仅 API 参考」：领域列表和 Kit 列表都要跟着换一套口径
document.getElementById('f-kind').addEventListener('change', () => {
  document.getElementById('f-sub').value = '';
  document.getElementById('f-kit').value = '';
  fillSubs(); reload();
});
document.getElementById('f-sub').addEventListener('change', () => {
  fillKits();
  if (document.getElementById('f-sub').value) document.getElementById('f-kit').value = '';
  reload();
});
document.getElementById('f-kit').addEventListener('change', reload);
loadMe();

['f-rule','f-status'].forEach(id =>
  document.getElementById(id).addEventListener('change', reload));

// 每日同步：上次跑的时间与结果
fetch('/api/sync-status').then(r => r.json()).then(d => {
  if (!d || !d.exists) return;
  const nf = n => (n == null ? '—' : Number(n).toLocaleString('zh-CN'));
  const el = document.getElementById('last-sync');
  const iss = d.issues || {};
  el.textContent = `上次同步 ${(d.finished_at || '').slice(5, 16)} · 新增 ${nf(iss.new)} / 解决 ${nf(iss.resolved)}`;
  el.title = `开始 ${d.started_at}\n结束 ${d.finished_at}（${Math.round((d.seconds || 0) / 60)} 分钟）\n` +
    `文档 ${nf(d.docs && d.docs.before)} → ${nf(d.docs && d.docs.after)}\n` +
    `未解决 ${nf(iss.open_before)} → ${nf(iss.open_after)}\n` +
    (d.failed && d.failed.length ? `失败：${d.failed.join('、')}` : '无失败项');
  if (d.failed && d.failed.length) el.style.color = '#d93025';
}).catch(() => {});

document.getElementById('f-export').onclick = () => {
  const p = new URLSearchParams(query());
  p.delete('page'); p.delete('size');
  location.href = '/api/export.xlsx?' + p.toString();
};

// 识别时间：快捷项直接填日期区间，自定义时手填（两边相同＝单日）
function ymd(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function applyWhen(){
  const w = document.getElementById('f-when').value;
  const d1 = document.getElementById('f-d1'), d2 = document.getElementById('f-d2');
  const now = new Date(), t = ymd(now);
  const back = n => { const s = new Date(now); s.setDate(s.getDate() - n); return ymd(s); };
  if (w === 'today'){ d1.value = t; d2.value = t; }
  else if (w === '7d'){ d1.value = back(6); d2.value = t; }
  else if (w === '30d'){ d1.value = back(29); d2.value = t; }
  else if (w === ''){ d1.value = ''; d2.value = ''; }
  const custom = (w === 'custom');
  d1.disabled = !custom; d2.disabled = !custom;
  document.getElementById('f-range').style.display = (w === '') ? 'none' : 'inline-flex';
  if (w === '') document.getElementById('f-range').style.display = 'none';
  reload();
}
document.getElementById('f-when').addEventListener('change', applyWhen);
['f-d1','f-d2'].forEach(id => document.getElementById(id).addEventListener('change', reload));

// 支持 /issues?lang=en&rule=... 直达（英文页顶栏「All issues」会带 lang 参数）。
// 必须等 loadFacets() 把「板块 / 类型」两个下拉填充完再回填，否则设了值也会被重建的 option 冲掉。
function applyQuery(){
  const q = new URLSearchParams(location.search);
  const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
  set('f-lang', q.get('lang')); set('f-rule', q.get('rule'));
  set('f-section', q.get('section'));
  set('f-kind', q.get('kind'));            // 先定口径，领域列表才是对的
  fillSubs();
  if (q.get('domain')) document.getElementById('f-sub').value = q.get('domain');
  else set('f-sub', q.get('sub'));
  fillKits();
  const kitQ = q.get('kit');
  if (kitQ) {
    const parts = kitQ.split('|');
    const el = document.getElementById('f-kit');
    const want = parts.length === 2 ? `${parts[0]}|${parts[1]}` : '';   // 新格式：板块|归一化名
    const nm = parts.length === 3 ? parts[2] : '';                      // 旧格式：语言|板块|Kit 原名
    const hit = [...el.options].find(o => (want && o.value === want) || (nm && o.text.startsWith(nm)));
    if (hit) el.value = hit.value;
  }
  set('f-status', q.get('status'));
  const pg = parseInt(q.get('page') || '1', 10);
  if (pg > 1) state.page = pg;
}

loadMe().then(loadFacets).then(applyQuery).then(loadList);
</script>
</body>
